<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fandre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main>
    <header>
      <p class="family-label">The Fandre Family</p>
      <h1 class="family-name">FANDRE</h1>
      <p class="family-sub">fandre.com</p>
    </header>

    <nav class="cards">

      <a href="https://lily.fandre.com" class="card card--lily">
        <div class="card-inner">
          <div class="card-tag">Basketball · NBL1 Australia</div>
          <div class="card-name">Lily</div>
          <div class="card-detail">Forward · Lehigh University<br>1,000-Point Scorer · Pro Athlete</div>
          <div class="card-arrow">→</div>
        </div>
        <div class="card-bg card-bg--lily"></div>
      </a>

      <a href="https://clay.fandre.com" class="card card--clay">
        <div class="card-inner">
          <div class="card-tag">HPC Engineer · Saint Paul, MN</div>
          <div class="card-name">Clay</div>
          <div class="card-detail">Senior HPC Administrator<br>RedLine Performance Solutions</div>
          <div class="card-arrow">→</div>
        </div>
        <div class="card-bg card-bg--clay"></div>
      </a>

    </nav>
  </main>

  <footer>
    <span>fandre.com</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
